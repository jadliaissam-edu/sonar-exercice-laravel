# SonarQube project configuration (Community Build running on http://localhost:9000)
# The token is NEVER stored here. Pass it on the command line or via SONAR_TOKEN.
sonar.projectKey=jadli-laravel
sonar.projectName=JADLI Laravel Helpdesk
sonar.projectVersion=1.0

sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=app,routes,config,database
sonar.tests=tests

# Blade views are not analysed (the PHP analyzer would try to parse them as PHP)
sonar.exclusions=**/vendor/**,storage/**,bootstrap/cache/**,resources/views/**,**/*.blade.php,public/**

# Code that is configuration / wiring and is not expected to be covered by unit tests
sonar.coverage.exclusions=database/**,config/**,routes/**,bootstrap/**

# Reports generated by `sh scripts/coverage.sh` (paths are rewritten to be project-relative)
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=phpunit-report.xml
